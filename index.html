<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f1b3d">
<title>Horntail Loot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Theme A: navy + gold, 16px base */
:root{
  --text:#0f172a; --text2:#5b6478; --line:#dde2ec; --line2:#c5cde0; --bg:#e9edf5; --bg2:#f5f7fb;
  --navy:#0f1b3d; --navy2:#1a2a5a; --gold:#d4a017; --gold2:#f0c64a;
  --blue:#1e3a8a; --blue-d:#172f73; --blue-t:#1e3a8a; --blue-l:#eef2ff; --blue-b:#c7d2fe;
  --green:#0f7b5a; --green-t:#0b5e45; --green-l:#eaf7f1; --green-b:#a8e0c8;
  --red:#c2410c; --red-t:#9a3412; --red-l:#fff4ed; --red-b:#fed7aa;
  --amber-l:#fdf6e3; --amber-b:#f0d78c; --amber-t:#7a5a00;
  --gray-l:#eef1f6; --gray-t:#5b6478;
  --shadow-sm:0 1px 2px rgba(15,27,61,.05); --shadow:0 2px 6px rgba(15,27,61,.08),0 1px 2px rgba(15,27,61,.04);
}
*{box-sizing:border-box}
html{font-size:16px}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Sarabun',system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body.modal-open{overflow:hidden}
.wrap{max-width:780px;margin:0 auto;padding:0 16px}
main.wrap{padding-bottom:24px}
h1{font-size:24px;line-height:1.25;font-weight:700;letter-spacing:-.01em;margin:24px 0 4px;color:var(--navy)}
h2{font-size:18px;line-height:1.35;font-weight:700;margin:28px 0 10px;color:var(--navy)}
h3{font-size:16px;font-weight:700;margin:0 0 4px}
h3.mt2{margin-top:22px;font-size:14px;color:var(--text2);letter-spacing:.03em}
p{margin:0 0 8px}
.lead{font-size:15px;color:var(--text2);margin-bottom:18px}
.mt{margin-top:10px}.mt2{margin-top:20px}
.muted{color:var(--text2)}
b,strong{font-weight:700}
.card-title{font-size:16px;font-weight:700}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 16px;border-radius:10px;border:1px solid transparent;font:inherit;font-size:15px;font-weight:600;cursor:pointer;text-align:center;text-decoration:none;line-height:1.3;transition:background .15s,border-color .15s,box-shadow .15s;-webkit-tap-highlight-color:transparent}
.btn:focus-visible,input:focus-visible,select:focus-visible,.tile:focus-visible{outline:3px solid var(--gold2);outline-offset:2px}
.btn:active{transform:translateY(1px)}
.btn-primary{background:linear-gradient(180deg,#2748a8,#1e3a8a);color:#fff;box-shadow:0 3px 10px rgba(30,58,138,.28)}
.btn-primary:hover{background:linear-gradient(180deg,#2a4fb8,#172f73)}
.btn-success{background:linear-gradient(180deg,#139068,#0f7b5a);color:#fff;box-shadow:0 3px 10px rgba(15,123,90,.25)}
.btn-success:hover{background:#0b5e45}
.btn-danger{background:linear-gradient(180deg,#dc5a1e,#c2410c);color:#fff;box-shadow:0 3px 10px rgba(194,65,12,.25)}
.btn-outline{background:#fff;color:var(--blue-t);border:1.5px solid #9fb0dc;box-shadow:0 1px 2px rgba(15,27,61,.08)}
.btn-outline:hover{background:var(--blue-l);border-color:var(--blue)}
.btn-outline-red{background:#fff;color:var(--red-t);border:1.5px solid #f0b48c;box-shadow:0 1px 2px rgba(15,27,61,.08)}
.btn-outline-red:hover{background:var(--red-l);border-color:var(--red)}
.btn-chosen{background:var(--green);color:#fff;border:1px solid var(--green);box-shadow:0 2px 8px rgba(15,123,90,.22)}
.btn-off{background:#fff;color:var(--text2);border:1px solid var(--line2)}
.btn[disabled]{background:var(--gray-l);color:var(--gray-t);border-color:var(--line);box-shadow:none;cursor:not-allowed;transform:none}
.btn.btn-mine[disabled]{background:var(--green);color:#fff;border-color:var(--green);cursor:default}
.btn-block{display:flex;width:100%}
.btn-lg{min-height:48px;font-size:16px}
.btn-xl{min-height:52px;font-size:17px;border-radius:12px}
.btn-sm{min-height:36px;font-size:13px;padding:4px 12px}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}
.btn-row>.btn{flex:1 1 170px}
.reason{margin:5px 0 0;font-size:14px;color:var(--red-t);font-weight:600}
.reason.ok{color:var(--green)}
.btn-block+.muted,.btn-block+p.muted{font-size:13px;margin-top:6px}
.stack>*+*{margin-top:8px}

/* cards */
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 12px;box-shadow:0 1px 3px rgba(15,27,61,.07)}
.card.blue{background:var(--blue-l);border-color:var(--blue-b);border-left:5px solid var(--blue);box-shadow:none}
.card.green{background:var(--green-l);border-color:var(--green-b);border-left:5px solid var(--green);box-shadow:none}
.card.red{background:var(--red-l);border-color:var(--red-b);border-left:5px solid var(--red);box-shadow:none}
/* action panel: a card that holds buttons (header strip says who it's for) */
.panel{padding:0;overflow:hidden}
.panel-head{background:var(--navy);color:#fff;font-weight:700;font-size:14px;padding:8px 16px;display:flex;justify-content:space-between;gap:8px}
.panel-head span{color:var(--gold2);font-weight:600}
.panel-body{padding:14px 16px}
.panel-body>.btn+.btn,.panel-body>.btn+p+.btn{margin-top:10px}
.note{font-size:13px;color:var(--text2);margin:6px 0 0}
.sec-sub{font-size:14px;color:var(--text2);margin:-2px 0 12px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:10px;padding:8px 12px}
main h2{display:flex;align-items:center;gap:8px}
main h2::before{content:'';flex:none;width:4px;height:18px;border-radius:2px;background:var(--gold)}
.mybook-head{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;margin-bottom:6px}
.stat-chips{display:flex;gap:6px;flex-wrap:wrap}
.stat-chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px 12px;font-size:14px;color:var(--text2)}
.stat-chip b{color:var(--navy)}
.mybook .note{margin-top:8px}
.steps{display:grid;gap:14px}
.step{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start}
.step-no{width:28px;height:28px;border-radius:50%;background:var(--navy);color:var(--gold2);display:grid;place-items:center;font-weight:700;font-size:14px;margin-top:2px}
.step.done .step-no{background:var(--green);color:#fff}
.step-title{font-weight:700;font-size:15px;margin-bottom:6px;color:var(--navy)}
.step.done .step-title{color:var(--green-t)}
.step .note{margin:6px 0 0}
.pill.done{background:var(--green-l);color:var(--green-t);border-color:var(--green-b)}
.party-done{background:var(--bg2);box-shadow:none}
.seat-no{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;background:var(--navy);color:var(--gold2);font-size:12px;font-weight:700;margin-right:6px;vertical-align:1px}
.seat-wait{color:var(--text2);font-size:14px;font-style:italic}
.seat-wait .seat-no{background:var(--gray-l);color:var(--text2)}
.link-btn{background:none;border:0;padding:6px 0;font:inherit;font-size:14px;font-weight:600;color:var(--red-t);text-decoration:underline;cursor:pointer}
.card.mine{border:2px solid var(--green)}
.row-between{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.list-row{padding:8px 0;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:0}
.pill{display:inline-flex;align-items:center;padding:0 9px;border-radius:999px;font-weight:600;font-size:13px;border:1px solid;vertical-align:middle}
.pill.blue{background:var(--blue-l);color:var(--blue-t);border-color:var(--blue-b)}
.pill.green{background:var(--green-l);color:var(--green-t);border-color:var(--green-b)}
.pill.red{background:var(--red-l);color:var(--red-t);border-color:var(--red-b)}
.pill.gray{background:var(--gray-l);color:var(--gray-t);border-color:var(--line)}
.badge-neck{display:inline-flex;background:var(--amber-l);color:var(--amber-t);border:1px solid var(--amber-b);border-radius:999px;padding:0 9px;font-size:13px;font-weight:600;white-space:nowrap;vertical-align:middle}

/* topbar (navy) */
#topbar{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;border-bottom:1px solid #0a1430;box-shadow:0 2px 10px rgba(15,27,61,.18)}
.topbar-in{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding-top:8px;padding-bottom:8px}
.brand{font-weight:700;font-size:16px;color:#fff;background:none;border:0;padding:0;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:8px;min-height:40px}
.brand .dot{width:28px;height:28px;border-radius:8px;background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--navy);display:grid;place-items:center;font-size:14px;font-weight:700}
.whoami{margin-left:auto;font-size:14px;color:#aab4d4}
.whoami b{color:#fff}
.whoami .pts{color:var(--gold2);font-size:15px}
.whoami .badge-neck{background:rgba(240,198,74,.15);border-color:rgba(240,198,74,.4);color:var(--gold2)}
.topbar-in .btn{min-height:38px;font-size:14px;padding:4px 12px}
.topbar-in .btn-outline{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.22)}
.topbar-in .btn-outline:hover{background:rgba(255,255,255,.16)}
.topbar-in .btn-primary{background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--navy);box-shadow:none}
.strip.red{flex-basis:100%;background:var(--red-l);border:1px solid var(--red-b);color:var(--red-t);border-radius:10px;padding:6px 12px;font-weight:600;font-size:14px}
pre.code{white-space:pre-wrap;font-size:14px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0 0}
.code-input{width:100%;font:14px/1.5 ui-monospace,Menlo,monospace;padding:12px;border:1px solid var(--line2);border-radius:10px}
.top-actions{display:flex;gap:8px}
@media (max-width:560px){.whoami{flex-basis:100%;margin-left:0;order:3}.top-actions{margin-left:auto}.brand.has-back{display:none}.top-actions .btn{flex:1}}
@media (max-width:560px){.brand.has-back ~ .top-actions{flex:1}}

/* items */
.item{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:start}
.item-row{display:grid;grid-template-columns:48px 1fr;gap:10px 12px;align-items:start}
.item-action{grid-column:1/-1}
@media (min-width:640px){.item-row{grid-template-columns:48px 1fr 190px;align-items:center}.item-action{grid-column:auto}}
.icon{width:48px;height:48px;border-radius:10px;background:var(--bg2);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;color:var(--text2)}
.icon img{width:36px;height:36px;object-fit:contain;image-rendering:pixelated}
.icon.sm{width:40px;height:40px;border-radius:9px}.icon.sm img{width:30px;height:30px}
.item-name{font-size:16px;font-weight:700;line-height:1.35}
.item-type{font-size:14px;color:var(--text2)}
.price{display:inline-flex;align-items:baseline;gap:4px;font-size:13px;font-weight:700;color:var(--amber-t);background:var(--amber-l);border:1px solid var(--amber-b);border-radius:999px;padding:0 10px;margin-top:4px}
.winner{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;background:var(--green-l);border:1px solid var(--green-b);border-radius:10px;padding:8px 12px;font-size:15px}
.winner span{color:var(--green-t);font-weight:600}
.winner b{font-size:18px;color:var(--green-t)}
.order{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:5px}
.order li{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:15px;background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:6px 10px}
.order .rank{font-weight:700;min-width:22px;color:var(--text2);font-variant-numeric:tabular-nums}
.order li.first{background:var(--green-l);border-color:var(--green-b);font-weight:700}
.order li.first .rank{color:var(--green)}

.seg{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0 12px;background:var(--gray-l);padding:4px;border-radius:12px}
.seg .btn{flex:1 1 130px;min-height:40px;box-shadow:none}
.seg .btn-off{background:transparent;border-color:transparent}
.seg .btn-chosen{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:var(--shadow)}
input[type=text],input[type=number],input[type=search],select{font:inherit;font-size:16px;min-height:44px;width:100%;padding:6px 12px;border:1px solid var(--line2);border-radius:10px;background:#fff;color:var(--text);box-shadow:var(--shadow-sm)}
input:focus,select:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px rgba(30,58,138,.18)}
label.big-label{display:block;font-size:14px;font-weight:600;margin:0 0 5px;color:var(--text)}
main.wrap.wide{max-width:1040px}
.pin-input{font-size:28px !important;letter-spacing:14px;text-align:center;max-width:200px;font-weight:700;font-variant-numeric:tabular-nums}
.pin-mask{-webkit-text-security:disc}
.err{color:var(--red-t);font-weight:600;font-size:15px;margin-top:8px}

.name-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.name-btn{flex-direction:column;align-items:flex-start;min-height:54px;gap:0;text-align:left;padding:8px 14px;background:#fff;color:var(--text);border-color:var(--line2)}
.name-btn:hover{border-color:var(--gold);background:var(--amber-l)}
.name-btn small{font-size:13px;font-weight:500;color:var(--text2)}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:#fff;border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:12px;padding:12px 16px;font:inherit;color:var(--text);cursor:pointer;box-shadow:var(--shadow-sm);transition:border-color .15s,box-shadow .15s;min-height:44px}
.tile:hover{box-shadow:var(--shadow);border-color:var(--blue-b);border-left-color:var(--gold)}
.tile-title{font-size:16px;font-weight:700;color:var(--navy)}
.tile-desc{font-size:14px;color:var(--text2)}
.hero-actions{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:640px){.hero-actions{grid-template-columns:1fr 1fr}}

table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:15px;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tbl th,.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl th{background:var(--navy);font-size:13px;font-weight:600;color:#dfe5f5}
.tbl td.num,.tbl th.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl tr.me td{background:var(--amber-l)}
.big-num{font-size:18px;font-weight:700;color:var(--blue-t);font-variant-numeric:tabular-nums}
.up{color:var(--green);font-weight:700}.down{color:var(--red-t);font-weight:700}
.table-scroll{overflow-x:auto}
.stat{text-align:center;background:linear-gradient(160deg,var(--navy),var(--navy2));border:0;color:#fff}
.stat .muted{color:#aab4d4}
.stat-num{font-size:44px;font-weight:700;color:var(--gold2);line-height:1.1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}

.stepper{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}
.stepper .btn{min-width:44px;padding:0;font-size:20px}
.stepper .val{min-width:90px;text-align:center;font-size:16px;font-weight:700}
.sticky-save{position:sticky;bottom:0;background:rgba(244,246,251,.92);backdrop-filter:blur(6px);padding:10px 0;border-top:1px solid var(--line)}
.price-input{width:110px}

.rules ol{padding-left:22px;font-size:15px;margin:0}.rules li{margin-bottom:8px}.rules li:last-child{margin-bottom:0}

.party-info{display:inline-flex;flex-wrap:wrap;gap:4px 10px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:10px;padding:6px 12px;font-size:15px;margin:-8px 0 14px}
input[type=time]{font:inherit;font-size:16px;min-height:44px;width:100%;max-width:200px;padding:6px 12px;border:1px solid var(--line2);border-radius:10px;background:#fff;color:var(--text)}

.day-count{font-size:13px;font-weight:600;color:var(--text2);background:#fff;border:1px solid var(--line);border-radius:999px;padding:0 10px}
.cancelled-card{background:var(--bg2);box-shadow:none}
.cancelled-card .muted{font-size:14px}

/* item filter tabs */
.filter-label{font-size:14px;font-weight:600;margin:0 0 6px}
.filter-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.ftab{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:8px 12px;border-radius:12px;border:2px solid var(--line2);background:#fff;color:var(--text2);font:inherit;font-size:15px;font-weight:600;cursor:pointer}
.ftab:hover{border-color:var(--blue)}
.ftab.on{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:0 3px 10px rgba(15,27,61,.25)}
.ftab .cnt{display:inline-flex;min-width:26px;justify-content:center;padding:0 7px;border-radius:999px;font-size:13px;background:var(--gray-l);color:var(--text2)}
.ftab.on .cnt{background:var(--gold2);color:var(--navy)}
.filter-note{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;background:var(--amber-l);border:1px solid var(--amber-b);color:var(--amber-t);border-radius:12px;padding:8px 12px;font-size:14px;margin-bottom:12px}

/* party groups */
.groups{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));align-items:start;margin-bottom:12px}
.groups .card{margin:0}
.cards-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));align-items:start;margin-bottom:12px}
.cards-grid>.card{margin:0}
.cards-grid .item-row{grid-template-columns:48px 1fr}
.cards-grid .item-action{grid-column:1/-1}
@media (max-width:420px){.cards-grid{grid-template-columns:1fr}}
.group{padding:12px 14px}
.add-tile{display:flex;align-items:center;justify-content:center;min-height:120px;border:2px dashed #9fb0dc;border-radius:14px;background:transparent;color:var(--blue-t);font:inherit;font-weight:700;font-size:15px;cursor:pointer}
.add-tile:hover{background:#fff;border-color:var(--blue)}
.group-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:-12px -14px 4px;padding:8px 14px;background:var(--bg2);border-bottom:1px solid var(--line);border-radius:14px 14px 0 0}
.group-head b{font-size:15px;color:var(--navy)}
.group-head .muted{font-size:13px}
.mem{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:7px 0;border-top:1px solid var(--line);font-size:15px}
.group-head+.mem{border-top:0}
.mem-act{justify-content:flex-end}
.mem .btn-sm{min-height:30px;padding:2px 10px;font-size:12px;border-width:1px;box-shadow:none;border-radius:8px}
.mem.me{background:var(--blue-l);margin:0 -14px;padding:7px 14px}
.mem .muted{font-size:13px}
.mem-pts{font-weight:700;color:var(--blue-t);text-align:right;font-variant-numeric:tabular-nums}
.mem-pts small{font-weight:500;color:var(--text2);font-size:12px}
.mem-bk,.mem-act{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:12px;padding:0 9px;border-radius:999px;background:var(--amber-l);color:var(--amber-t);border:1px solid var(--amber-b)}
.slot{border:1px dashed var(--line2);border-radius:9px;padding:5px;text-align:center;color:var(--text2);font-size:13px;margin-top:6px}

.lock-banner{display:flex;gap:12px;align-items:center;background:var(--navy);color:#fff;border-radius:14px;padding:12px 16px;margin:0 0 12px;font-size:22px;border-left:5px solid var(--gold)}
.lock-banner b{font-size:16px;color:var(--gold2)}
.lock-banner div div{font-size:13px;color:#c9d1ea}
.lock-pop{font-size:44px;text-align:center;line-height:1}

/* toast */
#toast{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:100;width:min(94vw,520px);display:none}
#toast.show{display:block}
#toast .t{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 10px 10px 16px;border-radius:12px;font-size:15px;font-weight:600;background:#fff;border:1px solid var(--line);box-shadow:0 10px 25px rgba(15,27,61,.18)}
#toast .t.ok{border-left:6px solid var(--green);color:var(--green-t)}
#toast .t.err{border-left:6px solid var(--red);color:var(--red-t)}
#toast .t .btn{min-height:36px;font-size:14px;padding:4px 12px}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(15,27,61,.55);backdrop-filter:blur(2px);z-index:50;display:flex;align-items:center;justify-content:center;padding:12px}
.modal{background:#fff;border-radius:16px;max-width:520px;width:100%;max-height:92vh;overflow:auto;padding:20px;box-shadow:0 20px 50px rgba(15,27,61,.35);border-top:4px solid var(--gold)}
.modal h2{margin-top:0}
.modal-body{font-size:15px;margin-bottom:16px;color:var(--text)}
.reel{border:1px solid #2a3a6e;border-radius:12px;height:64px;display:grid;place-items:center;font-size:22px;font-weight:700;background:var(--navy);color:var(--gold2);margin:10px 0}
.reel.done{border-color:var(--green-b);background:var(--green-l);color:var(--green-t)}

/* demo panel */
#demo:empty{display:none}
#demo{margin-top:40px;background:var(--amber-l);border-top:1px dashed var(--gold);padding:6px 0 32px}
#demo h2{margin-top:14px;color:var(--amber-t)}
#demo .card{border-color:var(--amber-b);box-shadow:none}
</style>
</head>

function createLocalBackend(key) {
  const subs = new Set();
  const read = () => { try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; } };
  const write = v => { try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) { console.error(e); } emit(); };
  const emit = () => { const snap = read(); subs.forEach(fn => fn(clone(snap))); };
  // other tabs → realtime in demo (mirrors Firebase onValue)
  window.addEventListener('storage', e => { if (e.key === key) emit(); });
  return {
    /** cb(rootSnapshot) on every change; returns unsubscribe */
    subscribe(cb) { subs.add(cb); cb(clone(read())); return () => subs.delete(cb); },
    /** atomic read-modify-write at path; fn returns new value, or throws to abort */
    async transaction(path, fn) {
      const root = read() || {};
      const next = fn(clone(getAt(root, path)));
      if (next === undefined) return { committed: false };
      write(setAt(root, path, next));
      return { committed: true, value: next };
    },
    async set(path, val) { write(setAt(read() || {}, path, val)); },
  };
}

const FIREBASE_SDK = '13.3.0';
async function createFirebaseBackend(config, onConn) {
  const base = `https://www.gstatic.com/firebasejs/${FIREBASE_SDK}`;
  const [{ initializeApp }, { getAuth, signInAnonymously }, { getDatabase, ref, onValue, runTransaction, set }] =
    await Promise.all([import(`${base}/firebase-app.js`), import(`${base}/firebase-auth.js`), import(`${base}/firebase-database.js`)]);
  const app = initializeApp(config);
  await signInAnonymously(getAuth(app));          // rules require auth != null
  const db = getDatabase(app);
  onValue(ref(db, '.info/connected'), s => onConn(!!s.val()));
  const clean = v => (v === undefined ? null : JSON.parse(JSON.stringify(v)));   // RTDB rejects undefined
  return {
    subscribe(cb, onErr) { return onValue(ref(db, '/'), snap => cb(snap.val()), onErr); },
    async transaction(path, fn) {
      let userErr = null;
      const res = await runTransaction(ref(db, path || '/'), cur => {
        userErr = null;
        try { const next = fn(clone(cur)); return next === undefined ? undefined : clean(next); }
        catch (e) {
          userErr = e;
          // RTDB may call first with a stale/empty local value; returning null for an empty node
          // forces a server round-trip and a retry with real data (no-op if it really is empty).
          return cur === null ? null : undefined;
        }
      });
      if (userErr) throw userErr;
      return { committed: res.committed, value: res.snapshot.val() };
    },
    async set(path, val) { await set(ref(db, path || '/'), clean(val)); },
  };
}

    await backend.transaction(`parties/${pid}`, p => {
      ownerCheck(p, actorId);
      if (!isLive(p) || p.locked) throw new UErr('ปิดจองแล้ว เอาคนออกไม่ได้');
      if (mid === p.createdBy) throw new UErr('เอาคนเปิดตี้ออกไม่ได้');
      delete p.members[mid]; if (p.slots) delete p.slots[mid]; if (p.bookings) delete p.bookings[mid]; return p;
    });
  },

  async book(pid, mid, itemId) {
    await backend.transaction('', root => {
      const p = root.parties[pid], m = root.members[mid];
      if (!isLive(p)) throw new UErr('ตี้นี้จบแล้ว จองไม่ได้');
      if (p.locked) throw new UErr('ปิดจองแล้ว (ลงบอสแล้ว)');
      if (!p.members[mid]) throw new UErr('คุณไม่ได้อยู่ในตี้นี้');
      const e = canBook(root, p, m, itemId); if (!e.ok) throw new UErr(e.reason);
      p.bookings = p.bookings || {}; p.bookings[mid] = p.bookings[mid] || {};
      p.bookings[mid][itemId] = Date.now(); return root;
    });
  },

  async unbook(pid, mid, itemId) {
    await backend.transaction(`parties/${pid}`, p => {
      const b = p && p.bookings && p.bookings[mid];
      if (!b || b[itemId] == null) throw new UErr('คุณไม่ได้จองชิ้นนี้');
      if (!isLive(p)) throw new UErr('ตี้นี้จบแล้ว');
      if (p.locked) throw new UErr('ปิดจองแล้ว (ลงบอสแล้ว) ยกเลิกไม่ได้');
      delete b[itemId]; if (!keys(b).length) delete p.bookings[mid]; return p;
    });
  },

  /** "ปิดจอง · ลงบอส": freeze every booking before the boss (nobody can book after seeing a drop)
   *  and fix the necklace pick-up order by points (equal points → random). */
  async lock(pid, actorId) {
    await backend.transaction('', root => {
      const p = root.parties[pid]; ownerCheck(p, actorId);
      if (!isLive(p)) throw new UErr('ตี้นี้ปิดจองไม่ได้');
      if (p.locked) throw new UErr('ปิดจองไปแล้ว');
      const now = Date.now(); p.locked = { at: now, by: actorId }; p.status = 'started';   // also closes the member list
      const ids = bookersOf(p, NECK);
      if (ids.length) {
        const pts = Object.fromEntries(ids.map(id => [id, root.members[id] ? root.members[id].points : 0]));
        const r = rankWithTies(ids, id => pts[id]);
        p.neckOrder = { order: r.order, points: pts, ties: r.ties, at: now, by: actorId };
      }
      return root;
    });
  },

  /** equal points at the top of an item → opener rolls once; everyone on the party page sees it */
  async tieRoll(pid, itemId, pool, pts, actorId) {
    await backend.transaction('', root => {
      const p = root.parties[pid]; ownerCheck(p, actorId);
      if (!isLive(p)) throw new UErr('ตี้นี้สุ่มไม่ได้แล้ว');
      if (!p.locked) throw new UErr('ต้องปิดจองก่อน');
      if (pool.length < 2) throw new UErr('ต้องมี 2 คนขึ้นไปถึงจะสุ่ม');
      const bk = bookersOf(p, itemId); if (!pool.every(id => bk.includes(id))) throw new UErr('มีคนที่ไม่ได้จองชิ้นนี้');
      if (tieOrdersOf(p.tieRolls, itemId).some(o => pool.every(id => o.includes(id)))) throw new UErr('สุ่มไปแล้ว');
      p.tieRolls = p.tieRolls || {}; const id = newId('t', 6);
      p.tieRolls[id] = { id, itemId: Number(itemId), pool: [...pool].sort(), order: shuffle(pool), points: Object.fromEntries(pool.map(m => [m, pts])), at: Date.now(), by: actorId };
      return root;
    });
  },

  async confirmResult(pid, actorId, res) {
    await backend.transaction('', root => {
      const p = root.parties[pid]; ownerCheck(p, actorId);
      if (!isLive(p)) throw new UErr('ตี้นี้บันทึกผลไปแล้ว');
      const ids = new Set([...keys(p.members), ...res.awards.map(a => a.memberId)]);
      const before = {}, after = {};
      ids.forEach(id => { if (root.members[id]) before[id] = after[id] = root.members[id].points; });
      res.awards.forEach(a => { if (a.memberId in after) after[a.memberId] -= a.price; });
      res.finishers.forEach(id => { if (id in after) after[id] += 1; });
      Object.entries(after).forEach(([id, v]) => { if (v < 0) throw new UErr(`แต้มของ ${root.members[id].name} ไม่พอหัก`); });
      Object.entries(after).forEach(([id, v]) => { root.members[id].points = v; });
      res.awards.forEach(a => { if (Number(a.itemId) === NECK && root.members[a.memberId]) root.members[a.memberId].gotNecklace = true; });
      root.vault = root.vault || {};
      res.toVault.forEach(itemId => { const id = newId('v', 6); root.vault[id] = { id, itemId: Number(itemId), addedAt: Date.now(), fromParty: pid, status: 'open' }; });
      p.status = 'done'; p.doneAt = Date.now();
      p.result = { by: actorId, finishers: res.finishers, awards: res.awards, toVault: res.toVault, pointsBefore: before, pointsAfter: after };
      return root;
    });
  },

  async vaultRequest(vid, mid) {
    await backend.transaction('', root => {
      const v = root.vault && root.vault[vid]; if (!v) throw new UErr('ไม่พบของชิ้นนี้ในคลัง');
      const e = eligibility(root, root.members[mid], v.itemId); if (!e.ok) throw new UErr(e.reason);
      v.requests = v.requests || {}; v.requests[mid] = Date.now(); return root;
    });
  },
  async vaultCancel(vid, mid) {
    await backend.transaction(`vault/${vid}`, v => {
      if (!v) throw new UErr('ไม่พบของชิ้นนี้ในคลัง');
      if (v.requests) delete v.requests[mid]; return v;
    });
  },
  /** opener of a running party: equal points at the top → roll once */
  async vaultTieRoll(vid, pid, actorId) {
    await backend.transaction('', root => {
      const p = root.parties[pid]; ownerCheck(p, actorId);
      if (!isLive(p)) throw new UErr('ทำได้ตอนตี้กำลังเล่นเท่านั้น');
      const v = root.vault && root.vault[vid]; if (!v) throw new UErr('ไม่พบของชิ้นนี้ในคลัง');
      const top = vaultTop(root, v); if (!top || !top.tie) throw new UErr('ไม่มีคนแต้มเท่ากันแล้ว');
      v.rolls = v.rolls || {}; const id = newId('t', 6);
      v.rolls[id] = { id, itemId: v.itemId, pool: top.tie, order: shuffle(top.tie), points: Object.fromEntries(top.tie.map(m => [m, root.members[m].points])), at: Date.now(), by: actorId, partyId: pid };
      return root;
    });
  },
  /** opener hands the item over in-game, then presses this → points are deducted (must be the top requester) */
  async vaultDeliver(vid, mid, pid, actorId) {
    await backend.transaction('', root => {
      const p = root.parties[pid]; ownerCheck(p, actorId);
      if (!isLive(p)) throw new UErr('ส่งของได้ตอนตี้กำลังเล่นเท่านั้น');
      const v = root.vault && root.vault[vid], m = root.members[mid];
      if (!v || !m) throw new UErr('ไม่พบข้อมูล');
      const top = vaultTop(root, v);
      if (!top || top.id !== mid) throw new UErr('ข้อมูลเปลี่ยนแล้ว ลองดูใหม่อีกครั้ง');
      const price = priceIn(root, v.itemId);
      addLog(root, { type: 'vault-deliver', by: actorId, partyId: pid, memberId: mid, itemId: v.itemId, price, before: m.points, after: m.points - price, order: vaultRank(root, v).map(x => x.id) });
      m.points -= price; delete root.vault[vid]; return root;
    });
  },
  /** top requester doesn't want it → drop their request, next in line */
  async vaultDecline(vid, mid, pid, actorId) {
    await backend.transaction('', root => {
      ownerCheck(root.parties[pid], actorId);
      const v = root.vault && root.vault[vid]; if (!v) throw new UErr('ไม่พบของ');
      if (v.requests) delete v.requests[mid]; return root;
    });
  },

  /** first-time setup: only allowed while the database has no members */
  async importInitial(list, rounds = []) {
    await backend.transaction('', root => {
      if (root && root.members && keys(root.members).length) throw new UErr('มีรายชื่ออยู่แล้ว นำเข้าซ้ำไม่ได้');
      return buildInitial(list, rounds, Date.now());
    });
  },
  /** self sign-up: starts at 0 points, usable right away */
  async register({ name, job }) {
    let id;
    await backend.transaction('', root => {
      name = checkName(root, name, null, 'มีชื่อนี้อยู่แล้ว ลองค้นหาชื่อด้านบน');
      if (!JOBS.includes(job)) throw new UErr('เลือกอาชีพก่อน');
      id = newId('m', 6);
      root.members[id] = { id, name, job, points: 0, gotNecklace: false, pinHash: null, selfRegistered: true };
      addLog(root, { type: 'member-register', by: id, memberId: id, name }); return root;
    });
    return id;
  },
  /** change your own display name (points/history are keyed by id, so they follow) */
  async rename(mid, name) {
    await backend.transaction('', root => {
      const m = root.members && root.members[mid]; if (!m) throw new UErr('ไม่พบชื่อนี้');
      const to = checkName(root, name, mid);
      if (to === m.name) throw new UErr('ชื่อเดิม ไม่ได้เปลี่ยน');
      addLog(root, { type: 'member-rename', by: mid, memberId: mid, from: m.name, to });
      m.name = to; return root;
    });
  },
};
/** first-time data: members, default prices, and past rounds from the old system
 *  (a round = who came, split into in-game parties; drops not recorded; everyone +1) */
function buildInitial(list, rounds, now) {
  const members = {}, prices = {}, parties = {}, idOf = {};
  list.forEach((x, i) => { const id = 'm' + (i + 1); idOf[x.name.toLowerCase()] = id; members[id] = { id, name: x.name, job: x.job, points: x.points, gotNecklace: x.gotNecklace, pinHash: null }; });
  ITEMS.forEach(it => { prices[it.id] = defaultPrice(it.id); });
  rounds.forEach((r, k) => {
    const [y, mo, d] = r.date.split('-').map(Number), ts = new Date(y, mo - 1, d, 12).getTime() + k;
    let n = 1; while (parties[partyIdOf(ts, n)]) n++;
    const pid = partyIdOf(ts, n), mem = {}, slots = {}, before = {}, after = {};
    r.groups.forEach((g, gi) => g.forEach((name, j) => { const id = idOf[name.toLowerCase()]; mem[id] = ts + gi * 10 + j; slots[id] = gi + 1; }));
    keys(mem).forEach(id => { before[id] = members[id].points; after[id] = before[id] + 1; members[id].points += 1; });
    parties[pid] = { id: pid, createdAt: ts, createdBy: '', status: 'done', imported: true, startedAt: ts, doneAt: ts, members: mem, slots, groupCount: r.groups.length,
      result: { by: '', finishers: keys(mem), awards: [], toVault: [], pointsBefore: before, pointsAfter: after } };
  });
  return { version: 1, createdAt: now, members, prices, parties };
}
/** normalize + validate a member name; duplicate check ignores `selfId` */
function checkName(root, name, selfId, dupMsg = 'มีคนใช้ชื่อนี้แล้ว') {
  name = String(name || '').replace(/\s+/g, ' ').trim();
  if (!name) throw new UErr('ใส่ชื่อก่อน'); if (name.length > 20) throw new UErr('ชื่อยาวเกิน 20 ตัว');
  if (vals(root.members).some(m => m.id !== selfId && m.name.replace(/\s+/g, ' ').trim().toLowerCase() === name.toLowerCase())) throw new UErr(dupMsg);
  return name;
}

/** parse + validate the members JSON → {list, errors} */
function parseImport(text) {
  let data; try { data = JSON.parse(text); } catch (e) { return { list: [], errors: ['อ่านไม่ออก รูปแบบ JSON ผิด: ' + e.message] }; }
  const arr = Array.isArray(data) ? data : data && data.members;
  if (!Array.isArray(arr) || !arr.length) return { list: [], errors: ['ต้องมี "members" อย่างน้อย 1 คน'] };
  const errors = [], seen = new Set(), list = [];
  arr.forEach((x, i) => {
    const row = `แถวที่ ${i + 1}`, name = String((x && x.name) || '').replace(/\s+/g, ' ').trim(), pts = Number(x && x.points);
    if (!name) errors.push(`${row}: ไม่มีชื่อ`);
    else if (seen.has(name.toLowerCase())) errors.push(`${row}: ชื่อ "${name}" ซ้ำ`);
    if (!JOBS.includes(x && x.job)) errors.push(`${row} (${name || '?'}): อาชีพ "${x && x.job}" ไม่มีในรายการ`);
    if (!Number.isInteger(pts) || pts < 0) errors.push(`${row} (${name || '?'}): แต้มต้องเป็นเลขเต็ม 0 ขึ้นไป`);
    seen.add(name.toLowerCase());
    list.push({ name, job: x && x.job, points: pts, gotNecklace: !!(x && (x.gotNecklace || x.hadNecklace)) });
  });
  const rounds = [];
  (Array.isArray(data && data.rounds) ? data.rounds : []).forEach((r, i) => {
    const row = `rounds รอบที่ ${i + 1}`, groups = Array.isArray(r && r.groups) ? r.groups : [];
    if (!/^\d{4}-\d{2}-\d{2}$/.test((r && r.date) || '')) errors.push(`${row}: date ต้องเป็นแบบ 2026-11-17`);
    if (!groups.length || groups.length > MAX_GROUPS) errors.push(`${row}: ต้องมี 1–${MAX_GROUPS} ปาร์ตี้`);
    const used = new Set();
    groups.forEach((g, gi) => {
      if (!Array.isArray(g) || !g.length || g.length > GROUP_SIZE) errors.push(`${row} ปาร์ตี้ ${gi + 1}: ต้องมี 1–${GROUP_SIZE} คน`);
      (Array.isArray(g) ? g : []).forEach(n => {
        const key = String(n || '').trim().toLowerCase();
        if (!seen.has(key)) errors.push(`${row}: ไม่มีชื่อ "${n}" ใน members`);
        else if (used.has(key)) errors.push(`${row}: ชื่อ "${n}" ซ้ำ`);
        used.add(key);
      });
    });
    rounds.push({ date: r && r.date, groups: groups.map(g => (Array.isArray(g) ? g : []).map(n => String(n).trim())) });
  });
  return { list, rounds, errors };
}

/* ---- result entry (party opener) ---- */
function getDraft(p) {
  let d = UI.drafts[p.id];
  if (!d) { d = { booked: {}, extras: {} }; UI.drafts[p.id] = d; }
  return d;

/** necklace strands → member ids in the fixed order (or 'LEAVE' = nobody takes it) */
function resolveNeck(p, d) {
  const order = neckOrderOf(p) || [], b = d.booked[NECK] || { count: 0, picks: [] };
  const used = new Set(), out = new Array(b.count);
  for (let i = 0; i < b.count; i++) { const x = b.picks[i]; if (x && (x === 'LEAVE' || !used.has(x))) { out[i] = x; if (x !== 'LEAVE') used.add(x); } }
  for (let i = 0; i < b.count; i++) {
    if (out[i]) continue;
    const next = order.find(id => !used.has(id));
    out[i] = next || 'LEAVE'; if (next) used.add(next);
  }
  return out;
}
/** who gets what: necklace first (ordered before the boss), then most expensive first, most points wins.
 *  points drop as people win, so later items see the remaining points. A tie with no roll stops here. */
function computeResult(p, d) {
  const finishers = keys(p.members);   // everyone who came gets +1
  const awards = [], toVault = [], problems = [], items = {}, R = {};
  const pts = id => (id in R ? R[id] : (R[id] = DB.members[id] ? DB.members[id].points : 0));
  const nb = d.booked[NECK];
  if (nb && nb.count) {
    if (!neckOrderOf(p)) problems.push('ยังไม่ได้ปิดจอง');
    else resolveNeck(p, d).forEach(x => { if (x !== 'LEAVE') { pts(x); R[x] -= price(NECK); awards.push({ itemId: NECK, memberId: x, price: price(NECK), kind: 'booked' }); } });
  }
  let blocked = false;
  bookedItemIds(p).filter(id => id !== NECK).sort((a, b) => price(b) - price(a) || a - b).forEach(id => {
    const b = d.booked[id] || {}, info = items[id] = { dropped: !!b.drop, declined: b.declined || [], rank: [] };
    if (!info.dropped) return;
    if (blocked) { info.waiting = true; return; }
    const pr = price(id);
    info.rank = bookersOf(p, id).filter(x => !info.declined.includes(x)).map(x => ({ id: x, pts: pts(x), ok: pts(x) >= pr })).sort(byPts);
    const top = pickTop(info.rank.filter(x => x.ok), tieOrdersOf(p.tieRolls, id));
    if (!top) { info.toVault = true; toVault.push(id); return; }
    if (top.tie) { info.tie = top.tie; info.tiePts = pts(top.tie[0]); blocked = true; problems.push(`แต้มเท่ากัน ต้องสุ่ม ${shortName(id)}`); return; }
    info.winner = top.id; info.viaRoll = top.viaRoll; R[top.id] -= pr;
    awards.push({ itemId: id, memberId: top.id, price: pr, kind: 'booked' });
  });
  Object.entries(d.extras).forEach(([id, c]) => { for (let i = 0; i < c; i++) toVault.push(Number(id)); });
  return { finishers, awards, toVault, problems, items };
}
function stepper(act, id, val, label) {
  return `<div class="stepper"><button class="btn btn-outline" data-act="${act}" data-id="${id}" data-d="-1" ${val <= 0 ? 'disabled' : ''} aria-label="ลด">−</button>
    <span class="val">${label}</span><button class="btn btn-outline" data-act="${act}" data-id="${id}" data-d="1" aria-label="เพิ่ม">+</button></div>`;
}

  const booked = bookedItemIds(p);
  if (!booked.length) h += `<div class="card">ไม่มีใครจอง</div>`;
  if (booked.includes(NECK)) {
    const order = neckOrderOf(p), b = d.booked[NECK] || { count: 0, picks: [] };
    h += `<div class="card"><div class="item">${iconHtml(NECK)}<div><div class="item-name">${esc(itemOf(NECK).name)}</div><span class="price">${price(NECK)} แต้ม</span></div></div>`;

    else {
      h += `<div class="mt"><b>ลำดับ:</b>${orderHtml(order)}</div><div class="mt"><b>ดรอปกี่เส้น?</b>${stepper('cnt', NECK, b.count, b.count ? b.count + ' เส้น' : 'ไม่ดรอป')}</div>`;
      resolveNeck(p, d).forEach((pick, i) => {
        h += `<div class="mt"><b>เส้นที่ ${i + 1} ให้ใคร?</b><div class="stack" style="margin-top:6px">${order.map((id, k) => `<button class="btn btn-block ${pick === id ? 'btn-chosen' : 'btn-off'}" data-act="pick" data-item="${NECK}" data-i="${i}" data-v="${id}">${k + 1}. ${esc(nameOf(id))}${pick === id ? ' ✓' : ''}</button>`).join('')}

      if (info.declined.length) h += `<div class="row-between mt"><span class="muted">ไม่รับ: ${info.declined.map(id => esc(nameOf(id))).join(', ')}</span><button class="btn btn-outline" data-act="undecline" data-id="${itemId}">ล้าง</button></div>`;

  Object.entries(d.extras).forEach(([id, n]) => {

  });
  h += `<label class="big-label" for="extra-search">ค้นหาชื่อของ แล้วกด "เพิ่ม"</label><input id="extra-search" type="search" data-input="extra-search" placeholder="พิมพ์ชื่อของ" value="${esc(UI.extraSearch)}">`;
  const q = UI.extraSearch.trim().toLowerCase();
  if (q) {
    const found = ITEMS.filter(it => it.id !== NECK && !booked.includes(it.id) && !d.extras[it.id] && it.name.toLowerCase().includes(q)).slice(0, 8);
    h += `<div class="stack mt">${found.map(it => `<div class="card row-between" style="margin:0"><div class="item" style="grid-template-columns:44px 1fr;align-items:center">${iconHtml(it.id, true)}<b>${esc(it.name)}</b></div><button class="btn btn-primary" data-act="extra-add" data-id="${it.id}">เพิ่ม</button></div>`).join('') || '<div class="card">ไม่เจอ</div>'}</div>`;
  }

  const vs = vaultSectionHtml(p, true);
  if (vs) h += vs.replace('<h2>ของในคลังที่มีคนขอ', '<h2>3. ของในคลังที่มีคนขอ').replace('</h2>', '</h2><p class="sec-sub">ไม่เกี่ยวกับผลตี้ · ถ้าเทรดให้แล้วกด "ส่งแล้ว" ก่อนยืนยันผล เพราะหลังยืนยันผล ต้องรอส่งตอนตี้หน้า</p>');
  h += `<h2>สรุป</h2>${resultSummaryHtml(p, c)}`;
  h += c.problems.length ? disabledBtn('ยืนยันผล', c.problems.join(' · '), 'btn-lg') : `<button class="btn btn-success btn-lg btn-block" data-act="confirm-result">ยืนยันผล</button>`;

}
function previewPoints(p, c) {
  const before = {}, after = {};
  new Set([...keys(p.members), ...c.awards.map(a => a.memberId)]).forEach(id => { if (DB.members[id]) before[id] = after[id] = DB.members[id].points; });
  c.awards.forEach(a => { after[a.memberId] -= a.price; });
  c.finishers.forEach(id => { after[id] += 1; });
  return { pointsBefore: before, pointsAfter: after, finishers: c.finishers };
}
function resultSummaryHtml(p, c) {
  return `<div class="card blue"><b>ใครได้อะไร:</b>${c.awards.length ? c.awards.map(a => `<div>• ${esc(shortName(a.itemId))} → <b>${esc(nameOf(a.memberId))}</b> ${a.kind === 'free' ? '(แจกฟรี)' : `(หัก ${a.price})`}</div>`).join('') : '<div>ไม่มี</div>'}
    <div class="mt"><b>เข้าคลัง:</b> ${c.toVault.length ? c.toVault.map(id => esc(shortName(id))).join(', ') : 'ไม่มี'}</div></div>` + pointsTable(previewPoints(p, c));
}

function vaultStatusText(v, mid) {

  if (top && top.id === mid) return 'ตอนนี้คุณแต้มมากสุด ✓ ได้ของตอนมีตี้กำลังเล่น (หัวตี้ส่งให้)';
  if (top && top.tie && top.tie.includes(mid)) return 'แต้มเท่ากับคนอื่น · หัวตี้จะสุ่มตอนมีตี้';
  return 'มีคนแต้มมากกว่า · ถ้าเขาไม่รับ จะถึงคุณ';
}

  const cancelled = [...vals(DB.cancelled), ...legacy].sort((a, b) => b.cancelledAt - a.cancelledAt);
  const onDone = UI.histTab !== 'cancelled';
  let h = `<h1>ประวัติ</h1><div class="filter-tabs">
    <button class="ftab ${onDone ? 'on' : ''}" data-act="hist-tab" data-v="done" aria-pressed="${onDone}">${onDone ? '✓ ' : ''}ตี้ที่จบ <span class="cnt">${done.length}</span></button>
    <button class="ftab ${!onDone ? 'on' : ''}" data-act="hist-tab" data-v="cancelled" aria-pressed="${!onDone}">${!onDone ? '✓ ' : ''}ตี้ที่ยกเลิก <span class="cnt">${cancelled.length}</span></button></div>
    <p class="sec-sub">แบ่งตามวันเล่น · ตัดวันตอน 6 โมงเช้า (ตี้หลังเที่ยงคืนนับเป็นของคืนก่อน)</p>`;
  const byDay = (list, dayOf) => { const g = {}; list.forEach(x => { (g[dayOf(x)] = g[dayOf(x)] || []).push(x); }); return Object.entries(g).sort((a, b) => b[0].localeCompare(a[0])); };

  if (!onDone) {
    if (!cancelled.length) return h + `<div class="card">ยังไม่มีตี้ที่ยกเลิก</div>`;
    byDay(cancelled, c => c.day || gameDay(c.createdAt)).forEach(([day, list]) => {
      h += `<h2>${esc(dayLabel(day))} <span class="day-count">${list.length} ตี้</span></h2>`;
      list.forEach(c => {
        h += `<div class="card cancelled-card"><div class="row-between"><b class="card-title">${esc(c.name || partyName(c.partyId))}</b><span class="pill red">ยกเลิก</span></div>
          <div class="muted">${esc(nameOf(c.createdBy))} เป็นคนเปิด · ${keys(c.members).length} คน${c.bookings ? ` · จองไว้ ${c.bookings} ชิ้น` : ''}</div>
          <div class="muted">เปิด ${fmtDate(c.createdAt)} → ยกเลิก ${fmtDate(c.cancelledAt)}</div>
          ${c.time || c.note ? `<div class="muted">${c.time ? '⏰ ' + esc(c.time) : ''}${c.time && c.note ? ' · ' : ''}${c.note ? '📝 ' + esc(c.note) : ''}</div>` : ''}
          ${keys(c.members).length ? `<p class="note">ใครอยู่ในตี้: ${keys(c.members).map(id => esc(nameOf(id))).join(', ')}</p>` : ''}</div>`;
      });
    });
    return h + `<p class="note">ตี้ที่ยกเลิกไม่มีใครได้แต้ม และไม่นับเลขรอบ (เลขรอบนั้นถูกใช้กับตี้ถัดไป)</p>`;
  }

  if (!done.length) h += `<div class="card">ยังไม่มีตี้ที่จบ</div>`;
  let first = true;
  byDay(done, partyDay).forEach(([day, list]) => {
    h += `<h2>${esc(dayLabel(day))} <span class="day-count">${list.length} ตี้</span></h2>`;

function logText(l) {

function neckText(p) {
  const o = p.neckOrder;
  return `📿 ลำดับเก็บสร้อยฮอล — ${partyName(p.id)}\n` + o.order.map((id, i) => `${i + 1}) ${nameOf(id)} (${o.points[id]} แต้ม)`).join('\n') + (o.ties ? '\n(คนแต้มเท่ากัน สุ่มลำดับแล้ว)' : '');
}
function tieText(t, where) {
  return `🎲 แต้มเท่ากัน สุ่ม ${shortName(t.itemId)} — ${where}\nคนลุ้น: ${t.pool.map(id => `${nameOf(id)} (${t.points[id]} แต้ม)`).join(', ')}\n🎉 ได้: ${nameOf(t.order[0])}`;
}
function resultText(p) {
  const R = p.result;
  return `🐉 สรุป${partyName(p.id)} (Horntail)\n` +
    (R.awards.length ? R.awards.map(a => `✅ ${shortName(a.itemId)} → ${nameOf(a.memberId)} ${a.kind === 'free' ? '(แจกฟรี)' : `(-${a.price})`}`).join('\n') : 'ไม่มีใครได้ของ') +
    (R.toVault.length ? `\n📦 เข้าคลัง: ${R.toVault.map(shortName).join(', ')}` : '') +
    `\n📊 แต้ม: ` + keys(R.pointsAfter).map(id => `${nameOf(id)} ${R.pointsBefore[id]}→${R.pointsAfter[id]}`).join(', ');
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); }
  catch (e) { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  toast('คัดลอกแล้ว ✓ ไปวางใน Discord ได้เลย');
}

/** show the slot animation to everyone on the party page when a new roll appears */
function checkNewRolls() {
  const r = route(); if (r.name !== 'party' && r.name !== 'result') return;
  const p = DB.parties[r.pid]; if (!p) return;
  const fresh = [];
  if (p.locked) fresh.push({ key: `${p.id}:lock:${p.locked.at}`, at: p.locked.at, kind: 'lock', pid: p.id });
  if (p.neckOrder && p.neckOrder.ties) fresh.push({ key: `${p.id}:neck:${p.neckOrder.at}`, at: p.neckOrder.at, title: 'ลำดับเก็บสร้อยฮอล (แต้มเท่ากัน สุ่มแล้ว)', order: p.neckOrder.order, text: () => neckText(DB.parties[p.id]) });
  vals(p.tieRolls).forEach(t => fresh.push({ key: `${p.id}:tie:${t.id}`, at: t.at, title: `แต้มเท่ากัน สุ่ม: ${shortName(t.itemId)}`, order: [t.order[0]], pool: t.pool, text: () => tieText(t, partyName(p.id)) }));
  vals(DB.vault).forEach(v => vals(v.rolls).filter(t => t.partyId === p.id).forEach(t => fresh.push({ key: `vault:${v.id}:${t.id}`, at: t.at, title: `ของในคลัง แต้มเท่ากัน สุ่ม: ${shortName(t.itemId)}`, order: [t.order[0]], pool: t.pool, text: () => tieText(t, 'คลังของ') })));
  fresh.forEach(f => { f.pid = p.id; if (UI.seenRolls.has(f.key)) return; UI.seenRolls.add(f.key); if (f.at >= UI.loadedAt) UI.rollQueue.push(f); });
  playNext();
}
/** shown once to everyone on the party page when the opener locks bookings */
function lockPopup(f) {
  const p = DB.parties[f.pid], mid = meId(), mine = p && mid ? myBookings(p, mid) : [];
  const o = p && p.neckOrder;
  openModal(`<div class="lock-pop">🔒</div><h2 style="text-align:center">ปิดจองแล้ว · ลงบอสได้เลย</h2>
    <div class="modal-body">${mid && p && p.members[mid] ? (mine.length ? `<b>ของที่คุณจอง:</b> ${mine.map(id => esc(shortName(id))).join(', ')}` : 'คุณไม่ได้จองของรอบนี้') : ''}
    ${o ? `<div class="mt"><b>ลำดับเก็บสร้อยฮอล:</b>${orderHtml(o.order, id => ` <span class="muted">· ${o.points[id]} แต้ม</span>`)}</div>` : ''}
    <p class="note">จองเพิ่ม ยกเลิก หรือเปลี่ยนไม่ได้แล้ว</p></div>
    <button class="btn btn-primary btn-lg btn-block" id="lock-ok">รับทราบ</button>`);
  modalRoot.querySelector('#lock-ok').onclick = () => { closeModal(); UI.rolling = false; playNext(); };
}
function playNext() {
  const here = route().pid; UI.rollQueue = UI.rollQueue.filter(f => f.pid === here);   // only pop-ups for the party on screen
  if (UI.rolling || !UI.rollQueue.length) return;
  UI.rolling = true; const f = UI.rollQueue.shift();
  if (f.kind === 'lock') return lockPopup(f);
  const names = f.order.map(nameOf), reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  openModal(`<h2>${esc(f.title)}</h2><div class="reel" id="reel">…</div><ol class="order" id="roll-list"></ol>
    <div class="stack mt" id="roll-btns" style="display:none"><button class="btn btn-outline btn-lg btn-block" id="roll-copy">คัดลอกผลไป Discord</button><button class="btn btn-primary btn-lg btn-block" id="roll-close">ปิด</button></div>`);
  const reel = modalRoot.querySelector('#reel'), ol = modalRoot.querySelector('#roll-list');
  const finish = () => {
    modalRoot.querySelector('#roll-btns').style.display = '';
    modalRoot.querySelector('#roll-copy').onclick = () => copyText(f.text());
    modalRoot.querySelector('#roll-close').onclick = () => { closeModal(); UI.rolling = false; playNext(); };
  };
  const reveal = k => {
    const single = names.length === 1;
    if (k >= names.length) { reel.textContent = single ? `${names[0]} ได้!` : `ที่ 1: ${names[0]}`; reel.classList.add('done'); return finish(); }
    const pool = single && f.pool && f.pool.length > 1 ? f.pool.map(nameOf) : names.slice(k); let t = 0; const total = reduce || f.noSpin ? 0 : (k === 0 ? 1800 : 600);   // single winner: spin through everyone who wanted it
    const tick = () => {
      if (t >= total) {
        reel.textContent = single ? `${names[k]} ได้!` : `ที่ ${k + 1}: ${names[k]}`;
        if (!single) ol.insertAdjacentHTML('beforeend', `<li class="${k === 0 ? 'first' : ''}"><span class="rank">${k + 1}.</span><span>${esc(names[k])}</span></li>`);
        return setTimeout(() => reveal(k + 1), reduce ? 0 : 450);
      }
      reel.textContent = pool[Math.floor(rand() * pool.length)];
      const step = 60 + (t / total) * 160; t += step; setTimeout(tick, step);
    };
    tick();
  };
  reveal(0);
}

    console.error(e);
    html = `<h1>หน้านี้เปิดไม่ได้</h1><div class="card red"><p>มีข้อมูลบางอย่างผิดรูปแบบ (${esc(e.message)})</p><p class="muted">ลองกลับหน้าแรก ถ้ายังเป็นอีกให้บอกคนดูแลเว็บ${IS_DEMO ? ' · ใน demo กด "ล้างข้อมูลทดลอง" ด้านล่าง' : ''}</p></div><button class="btn btn-primary btn-block" data-act="home">กลับหน้าแรก</button>`;
  }
  if (!UI.login && r.name !== 'home' && !html.includes('data-act="home"')) html += `<button class="btn btn-outline btn-block mt2" data-act="home">กลับหน้าแรก</button>`;
  const app = document.getElementById('app'); app.innerHTML = html;
  app.classList.toggle('wide', r.name === 'party' && !UI.login);
  if (IS_DEMO) renderDemo(); else document.getElementById('demo').innerHTML = '';
  if (fid) { const el = document.getElementById(fid); if (el) { el.focus(); try { el.setSelectionRange(sel[0], sel[1]); } catch (e) {} } }
  else if (UI.login && UI.login.step === 'pin') { const el = document.getElementById('pin-in'); if (el) el.focus(); }
  checkNewRolls();
}

  'copy-result': el => copyText(resultText(DB.parties[el.dataset.pid])),
  // result draft

  drop: el => {
    const d = getDraft(DB.parties[route().pid]), id = el.dataset.id, old = d.booked[id] || {};

  decline: el => { const d = getDraft(DB.parties[route().pid]), b = d.booked[el.dataset.id]; b.declined = [...(b.declined || []), el.dataset.m]; render(); },

  pick: el => { const d = getDraft(DB.parties[route().pid]), b = d.booked[el.dataset.item]; b.picks[Number(el.dataset.i)] = el.dataset.v; render(); },
  extra: el => { const d = getDraft(DB.parties[route().pid]); const n = (d.extras[el.dataset.id] || 0) + Number(el.dataset.d); if (n <= 0) delete d.extras[el.dataset.id]; else d.extras[el.dataset.id] = Math.min(10, n); render(); },
  'extra-add': el => { const d = getDraft(DB.parties[route().pid]); d.extras[el.dataset.id] = 1; UI.extraSearch = ''; toast(`เพิ่ม ${shortName(el.dataset.id)} แล้ว ✓`); render(); },
  'cancel-party': async () => {

      { await run(() => Api.cancel(pid, meId()), 'ยกเลิกตี้แล้ว ✓'); if (!DB.parties[pid]) go('#/'); }
  },

      run(() => Api.kick(pid, id, meId()), `เอา ${nameOf(id)} ออกแล้ว ✓`);
  },
  'confirm-result': async () => {
    const p = DB.parties[route().pid], c = computeResult(p, getDraft(p));

    if (!(await confirmBox({ title: 'ยืนยันผลตี้นี้?', body: resultSummaryHtml(p, c) + '<p class="mt reason">กดแล้วแต้มเปลี่ยนทันที แก้กลับในเว็บไม่ได้</p>', ok: 'ยืนยันผล', okClass: 'btn-success' }))) return;
    await run(() => Api.confirmResult(p.id, meId(), c), 'บันทึกผลแล้ว ✓');
    if (DB.parties[p.id].status === 'done') { delete UI.drafts[p.id]; go('#' + p.id); }

  // vault (requests on vault page, actions by party opener on party page)
  'vault-request': async el => { const v = DB.vault[el.dataset.id]; if (await confirmBox({ title: `ขอ ${esc(shortName(v.itemId))}?`, body: `ราคา ${price(v.itemId)} แต้ม · ตอนนี้ยังไม่หักแต้ม<br>ได้ของตอนมีตี้กำลังเล่น · ถ้ามีคนขอหลายคน แต้มมากสุดได้`, ok: 'ขอเลย' })) run(() => Api.vaultRequest(v.id, meId()), `ขอ${thName(v.itemId)}แล้ว ✓`); },
  'vault-cancel': async el => { const v = DB.vault[el.dataset.id]; if (await confirmBox({ title: `ยกเลิกที่ขอ ${esc(shortName(v.itemId))}?`, ok: 'ยกเลิกที่ขอ', okClass: 'btn-danger', cancel: 'ไม่ยกเลิก' })) run(() => Api.vaultCancel(v.id, meId()), 'ยกเลิกแล้ว ✓'); },
  'vault-tie': async el => {
    const v = DB.vault[el.dataset.id], top = vaultTop(DB, v); if (!top || !top.tie) return render();
    if (await confirmBox({ title: `สุ่ม ${esc(shortName(v.itemId))}?`, body: `<p>แต้มเท่ากัน (${DB.members[top.tie[0]].points} แต้ม): ${namesOf(top.tie)}</p><p class="mt muted">โอกาสเท่ากันทุกคน · สุ่มแล้วแก้ไม่ได้ · ทุกคนในตี้เห็นผลพร้อมกัน</p>`, ok: 'สุ่มเลย' }))
      run(() => Api.vaultTieRoll(v.id, route().pid, meId()));
  },
  'vault-deliver': async el => {
    const v = DB.vault[el.dataset.id], m = DB.members[el.dataset.m], pr = price(v.itemId);
    if (await confirmBox({ title: 'ส่งของแล้วใช่ไหม?', body: `เทรดในเกมก่อน แล้วค่อยกด<br>${esc(shortName(v.itemId))} → <b>${esc(m.name)}</b><br>แต้ม ${esc(m.name)}: ${m.points} → <b>${m.points - pr}</b>`, ok: 'ใช่ ส่งแล้ว', okClass: 'btn-success' }))
      run(() => Api.vaultDeliver(v.id, m.id, route().pid, meId()), `ส่ง${thName(v.itemId)}ให้ ${m.name} แล้ว ✓`);
  },
  'vault-decline': async el => {
    const v = DB.vault[el.dataset.id], name = nameOf(el.dataset.m);
    if (await confirmBox({ title: `${esc(name)} ไม่รับ?`, body: 'ที่เขาขอไว้จะถูกยกเลิก แล้วให้คนถัดไป', ok: 'ใช่ ให้คนถัดไป' })) run(() => Api.vaultDecline(v.id, el.dataset.m, route().pid, meId()), 'ให้คนถัดไปแล้ว ✓');
  },
  'modal-close': () => closeModal(),
  'hist-toggle': el => { UI.openHist[el.dataset.id] = el.dataset.open !== '1'; render(); },
  'hist-tab': el => { UI.histTab = el.dataset.v; render(); },
  // demo
  'demo-as': () => { const id = UI.demoPick; if (!DB.members[id]) return; UI.login = null; ss.set('htloot-me', id); ls.set('htloot-last', id); toast(`ตอนนี้คุณคือ ${DB.members[id].name} ✓`); render(); window.scrollTo(0, 0); },
  'demo-reset': async () => {
    if (!(await confirmBox({ title: 'ล้างข้อมูลทดลอง?', body: 'ข้อมูลทดลองในเครื่องนี้จะกลับเป็นแบบเริ่มต้น', ok: 'ล้างข้อมูล', okClass: 'btn-danger', cancel: 'ไม่ล้าง' }))) return;
    UI.drafts = {}; UI.seenRolls.clear(); UI.loadedAt = Date.now(); ss.set('htloot-me', null); UI.login = null;
    await run(() => Api.resetDemo(), 'ล้างข้อมูลทดลองแล้ว ✓'); go('#/');
  },
};

const INPUT = {
  search: el => { UI.search = el.value; render(); },
  'extra-search': el => { UI.extraSearch = el.value; render(); },
  'board-search': el => { UI.boardSearch = el.value; render(); },
  reg: el => { UI.reg.name = el.value; render(); },
  rename: el => { UI.renameText = el.value; render(); },
  'login-search': el => { UI.loginSearch = el.value; render(); },
  import: el => { UI.importText = el.value; clearTimeout(UI.importT); UI.importT = setTimeout(render, 400); },
  'pin-new': el => { el.value = el.value.replace(/\D/g, '').slice(0, 4); UI.login.pin = el.value; UI.login.error = ''; render(); },
  'pin-login': el => {
    el.value = el.value.replace(/\D/g, '').slice(0, 4); if (el.value.length < 4) return;
    const L = UI.login, m = DB.members[L.memberId];
    if (m.pinHash === hashPin(m.id, el.value)) signIn(m.id); else { L.error = 'รหัสไม่ถูก ลองใหม่'; render(); }
  },
};
const CHANGE = {
  'board-job': el => { UI.boardJob = el.value; render(); },
  'reg-job': el => { UI.reg.job = el.value; render(); },
  'demo-pick': el => { UI.demoPick = el.value; render(); },
};

document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (!el || el.disabled) return; const fn = ACT[el.dataset.act]; if (fn) { e.preventDefault(); fn(el, e); } });
document.addEventListener('input', e => { const fn = INPUT[e.target.dataset.input]; if (fn) fn(e.target); });
document.addEventListener('change', e => { const fn = CHANGE[e.target.dataset.change]; if (fn) fn(e.target); });
window.addEventListener('hashchange', () => { UI.login = null; render(); window.scrollTo(0, 0); });

/* boot */
const BOOT = { error: null, online: null };
/** RTDB drops empty objects/arrays → restore the shape the UI expects */
function normalize(snap) {
  const d = snap || {};
  ['members', 'parties', 'vault', 'log', 'prices', 'cancelled'].forEach(k => { d[k] = d[k] || {}; });
  vals(d.parties).forEach(p => {
    p.members = p.members || {}; p.bookings = p.bookings || {}; p.tieRolls = p.tieRolls || {}; p.slots = p.slots || {}; p.groupCount = p.groupCount || 1;
    keys(p.bookings).forEach(mid => { const b = p.bookings[mid]; if (b == null || typeof b !== 'object') p.bookings[mid] = b == null ? {} : { [b]: 0 }; });   // old 1-item shape
    vals(p.tieRolls).forEach(r => { r.order = r.order || []; r.pool = r.pool || []; r.points = r.points || {}; });
    if (p.neckOrder) { p.neckOrder.order = p.neckOrder.order || []; p.neckOrder.points = p.neckOrder.points || {}; }
    if (p.result) ['awards', 'toVault', 'finishers'].forEach(k => { p.result[k] = p.result[k] || []; }), ['pointsBefore', 'pointsAfter'].forEach(k => { p.result[k] = p.result[k] || {}; });
  });
  vals(d.vault).forEach(v => { v.requests = v.requests || {}; v.rolls = v.rolls || {}; vals(v.rolls).forEach(r => { r.order = r.order || []; r.pool = r.pool || []; r.points = r.points || {}; }); });
  return d;
}
(async () => {
  try {
    if (!backend) {
      document.getElementById('app').innerHTML = '<p class="lead mt2">กำลังเชื่อมต่อ…</p>';
      backend = await createFirebaseBackend(FIREBASE_CONFIG, on => { BOOT.online = on; if (DB) renderTopbar(); });
    }
    backend.subscribe(snap => {
      if (IS_DEMO && (!snap || !snap.members)) { Api.resetDemo(); return; }  // demo first run → seed mock data
      DB = normalize(snap); render();
    }, err => { BOOT.error = 'อ่านข้อมูลไม่ได้ (' + (err && err.code || err) + ')'; render(); });
  } catch (e) {
    console.error(e); BOOT.error = 'เชื่อมต่อฐานข้อมูลไม่ได้ (' + (e && (e.code || e.message) || e) + ')'; render();
  }
})();
